<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microscope Camera & C‑Mount Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

select,input{
    width:100%;
    padding:10px;
    border:1px solid #d9d9d9;
    border-radius:6px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    background:#0052cc;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#003e99;
}

#results{
    margin-top:25px;
    background:#f4f7ff;
    padding:20px;
    border-radius:8px;
}

#overlay{
    margin-top:20px;
    text-align:center;
}

.good{color:#2e8b57;}
.warning{color:#ff9900;}
.bad{color:#cc0000;}
</style>
</head>

<body>

<div class="container">

<h1>Microscope Camera & C‑Mount Calculator</h1>

<div class="grid">

<div>
<label>Microscope</label>
<select id="microscope">

<option value="20">Leica DM500 (FN20)</option>
<option value="20">Leica DM750 (FN20)</option>
<option value="22">Leica DM1000 (FN22)</option>
<option value="22">Leica DM2000 (FN22)</option>
<option value="22">Leica DMi8 (FN22)</option>

<option value="22">Nikon Eclipse Si (FN22)</option>
<option value="22">Nikon Ci-L (FN22)</option>

<option value="22">Euromex Delphi‑X (FN22)</option>
<option value="22">Euromex iScope (FN22)</option>

<option value="26.5">Research Widefield (FN26.5)</option>

</select>
</div>

<div>
<label>Camera Sensor</label>

<select id="sensorPreset">

<option value="6.0,4.5">1/3"</option>
<option value="6.4,4.8">1/2"</option>
<option value="7.2,5.4">1/1.8"</option>
<option value="8.8,6.6" selected>2/3"</option>
<option value="13.2,8.8">1"</option>
<option value="17.3,13">Micro Four Thirds</option>
<option value="23.5,15.6">APS‑C</option>
<option value="36,24">Full Frame</option>

</select>
</div>

<div>
<label>Objective</label>

<select id="objective">
<option value="4">4x</option>
<option value="10" selected>10x</option>
<option value="20">20x</option>
<option value="40">40x</option>
<option value="60">60x</option>
<option value="100">100x</option>
</select>

</div>

<div>
<label>Adapter</label>

<select id="adapter">
<option value="0.35">0.35x</option>
<option value="0.5" selected>0.5x</option>
<option value="0.63">0.63x</option>
<option value="0.7">0.7x</option>
<option value="1">1.0x</option>
</select>

</div>

<div>
<label>Sensor Width (mm)</label>
<input id="sensor_w" value="8.8">
</div>

<div>
<label>Sensor Height (mm)</label>
<input id="sensor_h" value="6.6">
</div>

</div>

<button onclick="calculate()">
Calculate
</button>

<div id="results"></div>

<div id="overlay"></div>

</div>

<script>

document.getElementById("sensorPreset")
.addEventListener("change",function(){

let v=this.value.split(",");

document.getElementById("sensor_w").value=v[0];
document.getElementById("sensor_h").value=v[1];

calculate();

});

function calculate(){

const fn=
parseFloat(document.getElementById("microscope").value);

const objective=
parseFloat(document.getElementById("objective").value);

const adapter=
parseFloat(document.getElementById("adapter").value);

const sw=
parseFloat(document.getElementById("sensor_w").value);

const sh=
parseFloat(document.getElementById("sensor_h").value);

const diagonal=
Math.sqrt(sw*sw+sh*sh);

const projectedCircle=
fn*adapter;

const imageRadius=
projectedCircle/2;

const cornerRadius=
Math.sqrt(
(sw/2)*(sw/2)+
(sh/2)*(sh/2)
);

const coverage=
(diagonal/projectedCircle)*100;

const fieldOfView=
projectedCircle/objective;

let status="Excellent";
let css="good";
let colour="#2e8b57";
let rating="★★★★★ Perfect Optical Match";

if(cornerRadius>imageRadius){

status="Vignetting Risk";
css="bad";
colour="#cc0000";
rating="★★ Not Recommended";

}
else if(cornerRadius>(imageRadius*0.9)){

status="Near Limit";
css="warning";
colour="#ff9900";
rating="★★★★ Good Match";
}

const adapters=[0.35,0.5,0.63,0.7,1];

let ranking=
adapters.map(function(a){

return{
factor:a,
error:Math.abs(diagonal-(fn*a))
};

});

ranking.sort(function(a,b){
return a.error-b.error;
});

const recommended=
ranking[0].factor;

document.getElementById("results").innerHTML=`

<h2>Results</h2>

<p><b>Recommended Adapter:</b> ${recommended}x</p>

<p><b>Selected Adapter:</b> ${adapter}x</p>

<p><b>Sensor Diagonal:</b> ${diagonal.toFixed(2)} mm</p>

<p><b>Projected Image Circle:</b> ${projectedCircle.toFixed(2)} mm</p>

<p><b>Coverage:</b> ${coverage.toFixed(1)}%</p>

<p><b>Status:</b>
<span class="${css}">
${status}
</span>
</p>

<p><b>Effective Magnification:</b>
${(objective*adapter).toFixed(1)}x
</p>

<p><b>Field Of View:</b>
${fieldOfView.toFixed(2)} mm
</p>

<p><b>Recommendation:</b>
${rating}
</p>

<h3>Adapter Ranking</h3>

<ol>
${ranking.map(r=>`<li>${r.factor}x</li>`).join("")}
</ol>
`;

drawOverlay(
projectedCircle,
sw,
sh,
colour,
status,
rating
);

}
