<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microscope C-Mount Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}

h1{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:6px;
    background:#0052cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003fa0;
}

#results{
    margin-top:25px;
    padding:20px;
    background:#f4f7ff;
    border-radius:8px;
}

#overlay{
    margin-top:25px;
    text-align:center;
}

.good{
    color:#2e8b57;
}

.warning{
    color:#ff9900;
}

.bad{
    color:#cc0000;
}
</style>
</head>

<body>

<div class="container">

<h1>Microscope Camera & C‑Mount Calculator</h1>

<div class="grid">

<div>
