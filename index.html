<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GT Vision Microscope Camera Calculator</title>

<style>
:root{
    --gt-red:#BB2C2D;
    --gt-red-dark:#992223;
    --good:#2E8B57;
    --warning:#F4A000;
    --bad:#BB2C2D;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    align-items:center;
    gap:20px;
    background:var(--gt-red);
    color:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.logo{
    height:80px;
    width:auto;
    background:white;
    padding:8px;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

button{
    background:var(--gt-red);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:6px;
    margin-top:20px;
    cursor:pointer;
}

button:hover{
    background:var(--gt-red-dark);
}

#results{
    margin-top:20px;
    background:#fff5f5;
    padding:20px;
    border-left:5px solid var(--gt-red);
    border-radius:8px;
}

#overlay{
    width:100%;
    max-width:700px;
    margin:20px auto;
}

#overlay svg{
    width:100%;
    height:auto;
    display:block;
}

.status{
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

.good{
    background:#EAF7EF;
    color:var(--good);
    border:2px solid var(--good);
}

.warning{
    background:#FFF7E6;
    color:var(--warning);
    border:2px solid var(--warning);
}

.bad{
    background:#FCEAEA;
    color:var(--bad);
    border:2px solid var(--bad);
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
}

@media(max-width:768px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .logo{
        height:60px;
    }

}
</style>
</head>
<body>

<div class="container">

<div class="header">

<img
    src="GT Vision Updated Logo 2026.png"
    alt="GT Vision Logo"
    class="logo">

<div>
    <h1>Microscope Camera &amp; C‑Mount Calculator</h1>
    <p>Sensor Matchinggrid">

<div>
<label>Field Number (FN)</label>
<select id="fn">
<option value="20">FN20</option>
<option value="22" selected>FN22</option>
<option value="26.5">FN26.5</option>
<option value="30">FN30</option>
</select>
</div>

<div>
<label>Camera Sensor</label>
<select id="sensor">

<option value="6.0,4.5">1/3"</option>
<option value="6.4,4.8">1/2"</option>
<option value="8.8,6.6" selected>2/3" (IMX264)</option>
<option value="13.2,8.8">1" (IMX183)</option>
<option value="17.3,13">Micro Four Thirds</option>
<option value="23.5,15.6">APS‑C</option>
<option value="36,24">Full Frame</option>

</select>
</div>

<div>
<label>Objective</label>
<select id="objective">
<option value="4">4x</option>
<option value="10" selected>10x</option>
<option value="20">20x</option>
<option value="40">40x</option>
<option value="60">60x</option>
<option value="100">100x</option>
</select>
</div>

<div>
<label>C‑Mount Adapter</label>
<select id="adapter">
<option value="0.35">0.35x</option>
<option value="0.5" selected>0.5x</option>
<option value="0.63">0.63x</option>
<option value="0.7">0.7x</option>
<option value="1">1.0x</option>
</select>
</div>

</div>

<button onclick="calculate()">
Calculate
</button>

<div id="results"></div>

<div id="overlay"></div>

<div class="footer">
GT Vision | Microscope Camera Selection Tool
</div>

</div>

<script>

function calculate(){

    const fn =
        parseFloat(document.getElementById("fn").value);

    const objective =
        parseFloat(document.getElementById("objective").value);

    const adapter =
        parseFloat(document.getElementById("adapter").value);

    const values =
        document.getElementById("sensor")
        .value.split(",");

    const width =
        parseFloat(values[0]);

    const height =
        parseFloat(values[1]);

    const diagonal =
        Math.sqrt(
            width * width +
            height * height
        );

    const projectedCircle =
        fn * adapter;

    const coverage =
        (diagonal / projectedCircle) * 100;

    const effectiveMag =
        objective * adapter;

    const fieldOfView =
        projectedCircle / objective;

    let status = "";
    let css = "";
    let colour = "";

    if(
        coverage >= 95 &&
        coverage <= 105
    ){

        status = "Recommended";
        css = "good";
        colour = "#2E8B57";

    }
    else if(
        (coverage >= 85 && coverage < 95) ||
        (coverage > 105 && coverage <= 115)
    ){

        status = "Borderline";
        css = "warning";
        colour = "#F4A000";

    }
    else{

        status = "Not Recommended";
        css = "bad";
        colour = "#BB2C2D";
    }

    document.getElementById("results").innerHTML = `

        <h2>Results</h2>

        <div class="status ${css}">
            ${status}
        </div>

        <p><strong>Coverage:</strong>
        ${coverage.toFixed(1)}%</p>

        <p><strong>Projected Image Circle:</strong>
        ${projectedCircle.toFixed(2)} mm</p>

        <p><strong>Sensor Diagonal:</strong>
        ${diagonal.toFixed(2)} mm</p>

        <p><strong>Effective Magnification:</strong>
        ${effectiveMag.toFixed(1)}x</p>

        <p><strong>Field of View:</strong>
        ${fieldOfView.toFixed(2)} mm</p>

    `;

    drawOverlay(
        projectedCircle,
        width,
        height,
        colour,
        status,
        coverage
    );

}

    imageCircle,
    width,
    height,
    colour,
    status,
    coverage
){

    const scale =
        220 /
        Math.max(
            imageCircle,
            width,
            height
        );

    const radius =
        (imageCircle / 2) * scale;

    const sensorW =
        width * scale;

    const sensorH =
        height * scale;

    document.getElementById("overlay").innerHTML = `

    <svg
        viewBox="0 0 500 450"
        preserveAspectRatio="xMidYMid meet">

        <text
            x="250"
            y="25"
            text-anchor="middle"
            font-size="18"
            font-weight="bold">

            Sensor Coverage Visualisation

        </text>

        <!-- Legend -->

        <circle
            cx="25"
            cy="50"
            r="7"
            fill="#FFF5F5"
            stroke="#BB2C2D"
            stroke-width="2"/>

        <text
            x="40"
            y="55"
            font-size="14">

            Optical Image Circle

        </text>

        <rect
            x="18"
            y="70"
            width="14"
            height="14"
            fill="rgba(187,44,45,0.35)"
            stroke="#BB2C2D"
            stroke-width="2"/>

        <text
            x="40"
            y="82"
            font-size="14">

            Camera Sensor

        </text>

        <!-- Image Circle -->

        <circle
            cx="250"
            cy="180"
            r="${radius}"
            fill="#FFF5F5"
            stroke="#BB2C2D"
            stroke-width="4"/>

        <!-- Sensor -->

        <rect
            x="${250-(sensorW/2)}"
            y="${180-(sensorH/2)}"
            width="${sensorW}"
            height="${sensorH}"
            fill="rgba(187,44,45,0.35)"
            stroke="#
