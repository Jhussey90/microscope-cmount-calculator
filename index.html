<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microscope Camera & C-Mount Calculator</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    background:#f5f7fb;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}

h1{
    color:#0052cc;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

select,
input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#0052cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003f99;
}

#results{
    margin-top:25px;
    padding:20px;
    border-radius:8px;
    background:#f5f8ff;
}

#overlay{
    margin-top:20px;
    text-align:center;
}

.good{
    color:#2e8b57;
    font-weight:bold;
}

.warning{
    color:#ff9900;
    font-weight:bold;
}

.bad{
    color:#cc0000;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>Microscope Camera & C‑Mount Optimisation Calculator</h1>

<div class="grid">

<div>
<label>Microscope</label>
<select id="microscope">

<option value="20">Leica DM500 (FN20)</option>
<option value="20">Leica DM750 (FN20)</option>
<option value="22">Leica DM1000 (FN22)</option>
<option value="22" selected>Leica DM2000 (FN22)</option>
<option value="22">Leica DMi8 (FN22)</option>

<option value="22">Nikon Eclipse Si (FN22)</option>
<option value="22">Nikon Ci-L (FN22)</option>

<option value="22">Euromex Delphi-X (FN22)</option>
<option value="22">Euromex iScope (FN22)</option>

<option value="26.5">Research Widefield (FN26.5)</option>

</select>
</div>

<div>

<label>Camera Sensor</label>

<select id="sensorPreset">

<option value="6.0,4.5">1/3"</option>
<option value="6.4,4.8">1/2"</option>
<option value="7.2,5.4">1/1.8"</option>
<option value="8.8,6.6" selected>Sony IMX264 (2/3")</option>
<option value="7.4,5.0">Sony IMX178</option>
<option value="13.2,8.8">Sony IMX183 (1")</option>
<option value="17.3,13">Micro Four Thirds</option>
<option value="23.5,15.6">APS-C</option>
<option value="36,24">Full Frame</option>

</select>

</div>

<div>

<label>Objective</label>

<select id="objective">

<option value="4">4x</option>
<option value="10" selected>10x</option>
<option value="20">20x</option>
<option value="40">40x</option>
<option value="60">60x</option>
<option value="100">100x</option>

</select>

</div>

<div>

<label>C-Mount Adapter</label>

<select id="adapter">

<option value="0.35">0.35x</option>
<option value="0.5" selected>0.5x</option>
<option value="0.63">0.63x</option>
<option value="0.7">0.7x</option>
<option value="1">1.0x</option>

</select>

</div>

<div>

<label>Sensor Width (mm)</label>
<input id="sensor_w" value="8.8">

</div>

<div>

<label>Sensor Height (mm)</label>
<input id="sensor_h" value="6.6">

</div>

</div>

<button id="calculateBtn">
Calculate
</button>

<div id="results"></div>

<div id="overlay"></div>

</div>

<script>

document.getElementById("sensorPreset")
.addEventListener("change",function(){

    const vals=this.value.split(",");

    document.getElementById("sensor_w").value=vals[0];
    document.getElementById("sensor_h").value=vals[1];

    calculate();

});

document.getElementById("calculateBtn")
.addEventListener("click",calculate);

function calculate(){

    const fn=
    parseFloat(
        document.getElementById("microscope").value
    );

    const objective=
    parseFloat(
        document.getElementById("objective").value
    );

    const adapter=
    parseFloat(
        document.getElementById("adapter").value
    );

    const sw=
    parseFloat(
        document.getElementById("sensor_w").value
    );

    const sh=
    parseFloat(
        document.getElementById("sensor_h").value
    );

    const diagonal=
    Math.sqrt(
        (sw*sw)+(sh*sh)
    );

    const projectedCircle=
    fn*adapter;

    const imageRadius=
    projectedCircle/2;

    const cornerRadius=
    Math.sqrt(
        Math.pow(sw/2,2)+
        Math.pow(sh/2,2)
    );

    const coverage=
    (diagonal/projectedCircle)*100;

    const fieldOfView=
    projectedCircle/objective;

    const effectiveMag=
    objective*adapter;

    const adapters=
    [0.35,0.5,0.63,0.7,1];

    let ranked=
    adapters.map(function(a){

        return{
            factor:a,
            error:Math.abs(
                diagonal-(fn*a)
            )
        };

    });

    ranked.sort(function(a,b){
        return a.error-b.error;
    });

    const bestAdapter=
    ranked[0].factor;

    let status="Excellent";
    let className="good";
    let colour="#2e8b57";
    let rating="★★★★★ Perfect Match";

    if(cornerRadius>imageRadius){

        status="Vignetting Risk";
        className="bad";
        colour="#cc0000";
        rating="★★ Not Recommended";

    }
    else if(cornerRadius>imageRadius*0.9){

        status="Near Limit";
        className="warning";
        colour="#ff9900";
        rating="★★★★ Good Match";

    }

    document.getElementById("results").innerHTML=`

        <h2>Results</h2>

        <p><b>Recommended Adapter:</b> ${bestAdapter}x</p>

        <p><b>Selected Adapter:</b> ${adapter}x</p>

        <p><b>Sensor Diagonal:</b> ${diagonal.toFixed(2)} mm</p>

        <p><b>Projected Image Circle:</b> ${projectedCircle.toFixed(2)} mm</p>

        <p><b>Coverage:</b> ${coverage.toFixed(1)}%</p>

        <p><b>Status:</b>
        <span class="${className}">
        ${status}
        </span></p>

        <p><b>Effective Magnification:</b>
        ${effectiveMag.toFixed(1)}x
        </p>

        <p><b>Field Of View:</b>
        ${fieldOfView.toFixed(2)} mm
        </p>

        <p><b>Recommendation:</b>
        ${rating}
        </p>

        <h3>Adapter Ranking</h3>

        <ol>
        ${ranked.map(r =>
        `<li>${r.factor}x</li>`
        ).join("")}
        </ol>

    `;

    drawOverlay(
        projectedCircle,
        sw,
        sh,
        colour,
        status,
        rating
    );

}

function drawOverlay(
    imageCircle,
    sw,
    sh,
    colour,
    status,
    rating
){

    const scale=
    250/imageCircle;

    const radius=
    (imageCircle/2)*scale;

    const sensorW=
    sw*scale;

    const sensorH=
    sh*scale;

    document.getElementById("overlay").innerHTML=`

    <svg width="350" height="350">

        <circle
        cx="175"
        cy="160"
        r="${radius}"
        fill="#dcebff"
        stroke="#0052cc"
        stroke-width="3"/>

        <rect
        x="${175-sensorW/2}"
        y="${160-sensorH/2}"
        width="${sensorW}"
        height="${sensorH}"
        fill="rgba(255,0,0,0.35)"
        stroke="red"
        stroke-width="3"/>

        <text x="10" y="20">
        Blue = Microscope Image Circle
        </text>

        <text x="10" y="40">
        Red = Camera Sensor
        </text>

        <rect
        x="10"
        y="280"
        width="180"
        height="30"
        fill="${colour}"
        rx="5"/>

        <text
        x="100"
        y="300"
        text-anchor="middle"
        fill="white">
        ${status}
        </text>

        <text
        x="175"
        y="330"
        text-anchor="middle"
        font-size="16">
        ${rating}
        </text>

    </svg>

    `;

}

calculate();

</script>

</body>
</html>
