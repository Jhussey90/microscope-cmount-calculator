<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sensor Size Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

select,input{
    width:100%;
    padding:10px;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f4f7ff;
    border-radius:6px;
}
</style>
</head>
<body>

<h1>Microscope Sensor Size Calculator</h1>

<label>Microscope Field Number (FN)</label>
<select id="fn">
    <option value="20">FN20</option>
    <option value="22" selected>FN22</option>
    <option value="26.5">FN26.5</option>
</select>

<label>Objective Magnification</label>
<select id="objective">
    <option value="4">4x</option>
    <option value="10" selected>10x</option>
    <option value="20">20x</option>
    <option value="40">40x</option>
    <option value="100">100x</option>
</select>

<label>C-Mount Adapter</label>
<select id="adapter">
    <option value="0.35">0.35x</option>
    <option value="0.5" selected>0.5x</option>
    <option value="0.63">0.63x</option>
    <option value="0.7">0.7x</option>
    <option value="1">1.0x</option>
</select>

<button onclick="calculate()">Calculate</button>

<div id="result" class="result"></div>

<script>

function calculate(){

    const fn =
      parseFloat(document.getElementById('fn').value);

    const objective =
      parseFloat(document.getElementById('objective').value);

    const adapter =
      parseFloat(document.getElementById('adapter').value);

    const sensorDiagonal =
      fn * adapter;

    const fieldOfView =
      sensorDiagonal / objective;

    let recommended = "";

    if(sensorDiagonal <= 7)
        recommended = "1/2 inch sensor";

    else if(sensorDiagonal <= 11)
        recommended = "2/3 inch sensor";

    else if(sensorDiagonal <= 16)
        recommended = "1 inch sensor";

    else if(sensorDiagonal <= 22)
        recommended = "Micro Four Thirds";

    else if(sensorDiagonal <= 30)
        recommended = "APS-C";

    else
        recommended = "Full Frame";

    document.getElementById('result').innerHTML = `
        <h2>Results</h2>

        <p><strong>Required Sensor Diagonal:</strong>
        ${sensorDiagonal.toFixed(2)} mm</p>

        <p><strong>Recommended Sensor:</strong>
        ${recommended}</p>

        <p><strong>Effective Camera Magnification:</strong>
        ${(objective * adapter).toFixed(1)}x</p>

        <p><strong>Approximate Field of View:</strong>
        ${fieldOfView.toFixed(2)} mm</p>
    `;
}

calculate();

</script>

</body>
</html>
