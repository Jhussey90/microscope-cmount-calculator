<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GT Vision Microscope C-Mount Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:auto;
    padding:30px;
    background:#f5f7fb;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

input,select{
    width:100%;
    padding:10px;
}

button{
    padding:12px 20px;
    background:#0052cc;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#results,
#overlay{
    margin-top:20px;
}
</style>
</head>

<body>

<div class="card">

<h1>Microscope Camera & C‑Mount Calculator</h1>

<div class="grid">

<div>
<label>Microscope</label>

<select id="Field Number (FN)">
<option value="20">FN20</option>
<option value="22">FN22</option>
<option value="26.5">FN26.5</option>
</select>
</div>

<div>
<label>Camera Sensor</label>

<select id="sensorPreset">
<option value="6.0,4.5">1/3"</option>
<option value="6.4,4.8">1/2"</option>
<option value="8.8,6.6" selected>2/3"</option>
<option value="13.2,8.8">1"</option>
<option value="23.5,15.6">APS-C</option>
<option value="36,24">Full Frame</option>
</select>
</div>

<div>
<label>Objective</label>

<select id="objective">
<option>4</option>
<option selected>10</option>
<option>20</option>
<option>40</option>
<option>60</option>
<option>60</option> 
<option>100</option>
</select>
</div>

<div>
<label>Adapter</label>

<select id="adapter">
<option>0.35</option>
<option selected>0.5</option>
<option>0.63</option>
<option>0.7</option>
<option>1.0</option>
</select>
</div>

</div>

<button onclick="calculate()">
Calculate
</button>

<div id="results"></div>
<div id="overlay"></div>

</div>

<script>

function calculate(){

let fn=parseFloat(document.getElementById("microscope").value);

let sensorVals=
document.getElementById("sensorPreset")
.value.split(",");

let sw=parseFloat(sensorVals[0]);
let sh=parseFloat(sensorVals[1]);

let adapter=
parseFloat(document.getElementById("adapter").value);

let objective=
parseFloat(document.getElementById("objective").value);

let diagonal=
Math.sqrt(sw*sw+sh*sh);

let projectedCircle=
fn*adapter;

let coverage=
(diagonal/projectedCircle)*100;

const adapters=[0.35,0.5,0.63,0.7,1.0];

let best=
adapters.reduce((best,current)=>{

return Math.abs(diagonal-fn*current)
<
Math.abs(diagonal-fn*best)
?
current
:
best;

});

let status="Excellent";

if(coverage>105)
status="Vignetting Risk";
else if(coverage>95)
status="Near Limit";

document.getElementById("results").innerHTML=
`
<h3>Results</h3>

<p><b>Recommended Adapter:</b> ${best}x</p>

<p><b>Coverage:</b>
${coverage.toFixed(1)}%</p>

<p><b>Status:</b>
${status}</p>

<p><b>Effective Magnification:</b>
${(adapter*objective).toFixed(1)}x</p>
`;

drawOverlay(
projectedCircle,
sw,
sh,
status
);

}

function drawOverlay(
imageCircle,
sw,
sh,
status){

const scale=250/imageCircle;

const radius=
(imageCircle/2)*scale;

const sensorW=
sw*scale;

const sensorH=
sh*scale;

let colour="#28a745";

if(status==="Near Limit")
colour="#ff9800";

if(status==="Vignetting Risk")
colour="#dc3545";

document.getElementById("overlay").innerHTML=
`
<svg width="350" height="350">

<circle
cx="175"
cy="170"
r="${radius}"
fill="#dcebff"
stroke="#0052cc"
stroke-width="3"/>

<rect
x="${175-sensorW/2}"
y="${170-sensorH/2}"
width="${sensorW}"
height="${sensorH}"
fill="rgba(255,0,0,.35)"
stroke="red"
stroke-width="3"/>

<rect
x="10"
y="290"
width="160"
height="30"
fill="${colour}"/>

<text
x="90"
y="310"
fill="white"
text-anchor="middle">
${status}
</text>

</svg>
`;
}

calculate();

</script>

</body>
</html>
