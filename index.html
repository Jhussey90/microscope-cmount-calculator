<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GT Vision Microscope Camera Calculator</title>

<style>

:root{
    --gt-red:#BB2C2D;
    --gt-red-dark:#992223;
    --good:#2E8B57;
    --warning:#F4A000;
    --bad:#BB2C2D;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    align-items:center;
    gap:20px;
    background:var(--gt-red);
    color:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.logo{
    height:80px;
    width:auto;
    background:white;
    padding:8px;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

select,input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

button{
    background:var(--gt-red);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:6px;
    margin-top:20px;
    cursor:pointer;
}

#results{
    margin-top:20px;
    background:#fff5f5;
    padding:20px;
    border-left:5px solid var(--gt-red);
    border-radius:8px;
}

#overlay{
    text-align:center;
    margin-top:20px;
}

.status-box{
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

.good{
    background:#EAF7EF;
    border:2px solid var(--good);
    color:var(--good);
}

.warning{
    background:#FFF7E6;
    border:2px solid var(--warning);
    color:var(--warning);
}

.bad{
    background:#FCEAEA;
    border:2px solid var(--bad);
    color:var(--bad);
}

</style>
</head>
<body>

<div class="container">

<div class="header">

<img
src="GT Vision Updated Logo 2026.png"
alt="GT Vision Logo"
class="logo">

<div>
<h1>Microscope Camera & C‑Mount Calculator</hpter Recommendation</p>
</div>

</div>

<div class="grid">

<div>
<label>Field Number (FN)</label>
<select id="fn">
<option value="20">FN20</option>
<option value="22" selected>FN22</option>
<option value="26.5">FN26.5</option>
</select>
</div>

<div>
<label>Camera Sensor</label>
<select id="sensorPreset">
<option value="6.0,4.5">1/3"</option>
<option value="6.4,4.8">1/2"</option>
<option value="8.8,6.6" selected>2/3" (IMX264)</option>
<option value="13.2,8.8">1" (IMX183)</option>
<option value="17.3,13">Micro Four Thirds</option>
<option value="23.5,15.6">APS-C</option>
<option value="36,24">Full Frame</option>
</select>
</div>

<div>
<label>Objective</label>
<select id="objective">
<option value="4">4x</option>
<option value="10" selected>10x</option>
<option value="20">20x

<div id="overlay"></div>

function drawOverlay(
    imageCircle,
    width,
    height,
    colour,
    status,
    coverage
){

    const scale = 250 / imageCircle;

    const radius = (imageCircle / 2) * scale;

    const sensorW = width * scale;
    const sensorH = height * scale;

    document.getElementById("overlay").innerHTML = `

    <svg width="500" height="420" viewBox="0 0 500 420">

        <!-- Legend -->

        <g transform="translate(20,20)">

            <circle
                cx="8"
                cy="8"
                r="7"
                fill="#FFF5F5"
                stroke="#BB2C2D"
                stroke-width="2"/>

            <text
                x="24"
                y="13"
                font-size="14"
                fill="#333">
                Optical Image Circle
            </text>

            <rect
                x="0"
                y="26"
                width="14"
                height="14"
                fill="rgba(187,44,45,0.25)"
                stroke="#BB2C2D"
                stroke-width="2"/>

            <text
                x="24"
                y="38"
                font-size="14"
                fill="#333">
                Camera Sensor
            </text>

        </g>

        <!-- Optical Circle -->

        <circle
            cx="250"
            cy="180"
            r="${radius}"
            fill="#FFF5F5"
            stroke="#BB2C2D"
            stroke-width="4"/>

        <!-- Sensor -->

        <rect
            x="${250 - sensorW / 2}"
            y="${180 - sensorH / 2}"
            width="${sensorW}"
            height="${sensorH}"
            fill="rgba(187,44,45,0.30)"
            stroke="#BB2C2D"
            stroke-width="3"/>

        <!-- Coverage -->

        <text
            x="250"
            y="305"
            text-anchor="middle"
            font-size="18"
            font-weight="bold"
            fill="#333">
            Coverage: ${coverage.toFixed(1)}%
        </text>

        <!-- Status Badge -->

        <rect
            x="165"
            y="325"
            width="170"
            height="42"
            rx="20"
            fill="${colour}" />

        <text
            x="250"
            y="352"
            text-anchor="middle"
            font-size="18"
            font-weight="bold"
            fill="white">
            ${status}
        </text>

    </svg>

    `;
}
