<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microscope Calculator Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f7fb;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    max-width: 800px;
    margin: auto;
}

button {
    padding: 10px 20px;
    background: #0052cc;
    color: white;
    border: none;
    border-radius: 5px;
}

#result {
    margin-top: 20px;
}
</style>

</head>
<body>

<div class="card">

<h1>Microscope Calculator Test</h1>

<p>If you can see this page, GitHub Pages is working.</p>

<label>Field Number</label>
<input id="fn" value="22">

<br><br>

<label>C-Mount Factor</label>
<input id="adapter" value="0.5">

<br><br>

<button onclick="calculate()">
Calculate
</button>

<div id="result"></div>

</div>

<script>

function calculate() {

    const fn =
        parseFloat(document.getElementById('fn').value);

    const adapter =
        parseFloat(document.getElementById('adapter').value);

    const projected =
        fn * adapter;

    document.getElementById('result').innerHTML =
        '<h2>Result</h2>' +
        '<p>Projected Image Circle = ' +
        projected.toFixed(2) +
        ' mm</p>';
}

calculate();

</script>

</body>
</html>
